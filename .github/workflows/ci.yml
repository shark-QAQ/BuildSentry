name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python 3.14)
    runs-on: ubuntu-latest
    # 依赖里有 transformers / sentence-transformers，安装较慢，
    # 给足时间避免正常安装被误判为超时。
    timeout-minutes: 25
    env:
      # 强制 CPU 版 torch，避免在 runner 上拉 CUDA 轮子（好几个 GB）。
      # 不支持的 uv 版本会忽略该变量，不影响正确性。
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check app tests ui training
          uv run ruff format --check app tests ui training

      # 测试全部离线：不加载真实模型，推理走模拟模式。
      - name: Test
        run: uv run pytest tests/ -q --cov=app --cov-report=term-missing
