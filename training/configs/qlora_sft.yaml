# training/configs/qlora_sft.yaml
#
# BuildSentry 审核模型 QLoRA 微调配置（LLaMA-Factory）
#
# 目标硬件: RTX A6000 48GB，但该卡已被其它服务占用约 30GB，
#           实际可用约 16-21GB —— 因此用 QLoRA（4-bit）而非 bf16 全精度 LoRA。
#           若独占整卡（48GB 空闲），可去掉 quantization_bit 并改用 bf16 LoRA，
#           精度更高且速度更快。
#
# 用法（在 training/ 目录下）:
#   llamafactory-cli train configs/qlora_sft.yaml
#
# 训练前务必先跑:
#   python prepare_dataset.py check --input data/train.jsonl

### 模型
model_name_or_path: Qwen/Qwen3-8B

# 必须是 qwen3_nothink 而不是 qwen3！
# 推理侧 audit_contract.encode_for_model 显式传了 enable_thinking=False，
# 若训练侧用带思考的模板，就变成「训练开思考、推理关思考」的 skew，
# 微调效果会大幅打折。改动这里后请重新做一次 prompt 对齐检查（见 README）。
template: qwen3_nothink

### 方法
stage: sft
do_train: true
finetuning_type: lora
quantization_bit: 4  # QLoRA
quantization_method: bnb

lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all  # 8B 建议全模块，只挂 q_proj/v_proj 效果会明显偏弱

### 数据
dataset: buildsentry_audit
dataset_dir: .  # 读取本目录下的 dataset_info.json
cutoff_len: 4096  # 需覆盖「检索条文 + 方案段落」的实际长度
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 8

### 输出
output_dir: saves/qwen3-8b-qlora
overwrite_output_dir: true
logging_steps: 10
save_steps: 200
save_total_limit: 3
plot_loss: true
report_to: none

### 训练
per_device_train_batch_size: 2
gradient_accumulation_steps: 8  # 有效 batch = 16
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0
bf16: true  # A6000 (sm86) 原生支持
gradient_checkpointing: true
flash_attn: fa2  # sm86 支持

### 验证
val_size: 0.1
per_device_eval_batch_size: 2
eval_strategy: steps  # 旧版 LLaMA-Factory 为 evaluation_strategy
eval_steps: 200

### 导出适配器（推理侧 LORA_PATH 指向导出目录）
# 训练完成后执行:
#   llamafactory-cli export configs/export_adapter.yaml
